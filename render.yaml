services:
  - type: web
    name: recovery-companion-api
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    branch: main
    numInstances: 1
    buildCommand: >-
      python -m pip install --upgrade pip &&
      python -m pip install -r requirements.txt
    startCommand: >-
      python -m uvicorn app.production_api:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --no-access-log
      --no-server-header
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    buildFilter:
      paths:
        - app/**
        - prompts/**
        - requirements.txt
        - .python-version
        - render.yaml
    envVars:
      - key: RECOVERY_ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: RECOVERY_API_TOKEN
        sync: false
      - key: RECOVERY_MAX_REQUEST_BYTES
        value: "65536"
      - key: RECOVERY_RATE_LIMIT_REQUESTS
        value: "30"
      - key: RECOVERY_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: PYTHONUNBUFFERED
        value: "1"
