name: Mobile CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.1"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install mobile dependencies
        run: flutter pub get

      - name: Analyze mobile application
        run: flutter analyze --no-pub

      - name: Run notification and Beta support regressions
        run: >-
          flutter test --no-pub --reporter expanded
          test/notification_checkin_flow_test.dart
          test/beta_support_access_contract_test.dart

      - name: Run mobile tests
        run: flutter test --no-pub --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: recovery-companion-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
