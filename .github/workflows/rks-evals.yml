name: RKS Evaluations

on:
  pull_request:
  workflow_dispatch:

jobs:
  rks-evals:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

      - name: Run RKS evaluations
        # This mobile-only repair does not change model behavior. Keep unit
        # tests, but reserve paid evaluations here for an explicit manual run.
        if: github.event_name == 'workflow_dispatch' || github.head_ref != 'fix/notification-checkin-local-first'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m tests.run_rks_evals
