name: Backend CI

on:
  pull_request:
    paths:
      - "app/**"
      - "prompts/**"
      - "tests/**"
      - "requirements.txt"
      - ".python-version"
      - "render.yaml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "prompts/**"
      - "tests/**"
      - "requirements.txt"
      - ".python-version"
      - "render.yaml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile production API
        run: |
          python -m py_compile \
            app/production_api.py \
            app/production_security.py

      - name: Test production API boundary
        run: |
          python -m pytest \
            tests/test_production_api.py \
            tests/test_render_blueprint_contract.py \
            -q

      - name: Run complete backend suite
        run: python -m pytest
